name: 功能需求
description: 提出一個新功能或增強既有功能的想法
title: "[feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解決的問題 / 動機
      description: 目前缺少什麼?為什麼需要這個功能?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提議的做法
      description: 你希望怎麼實作?若已知會影響哪個 WP / 模組,請一併說明
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 考慮過的替代方案
    validations:
      required: false
