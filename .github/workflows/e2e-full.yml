# Tier 2 — 完整驗證閘（typecheck + Vitest + 全套 Playwright，含 @slow 與 webgpu 斷言）。
#
# 為什麼一定要 self-hosted：這個 suite 的環境**就是量測儀器的環境**。
# `backend.spec.ts` 要求 `backend === 'webgpu'`，而 GitHub-hosted runner 沒有 GPU，
# WebGPURenderer 會依 createRenderer.ts 的設計 fallback 成 WebGL2。真實 GPU、系統 Edge
# 與桌面計時特性無法在 cloud runner 上複製，所以這層跑在研究者的機器上。
#
# runner 需求：Windows + 已安裝 Microsoft Edge + **真實 GPU** + Node 20。
# `real-gpu` 是註冊時自訂的 label，不是預設 label：它把「這台機器是合格量測環境」這個
# 前提編進 runs-on。只寫 [self-hosted, windows] 的話，日後若有人加一台無 GPU 的 Windows
# runner（雲端 VM、容器），這個 job 會悄悄落到它身上，backend.spec.ts 的 webgpu 斷言就會
# 開始紅——而那正是本層唯一無法被 Tier 1 取代的東西。註冊步驟見 docs/guideline/ci-tiers.md §3。
name: E2E (full, self-hosted)

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  schedule:
    # 18:00 UTC = 隔日 02:00 Asia/Taipei
    - cron: '0 18 * * *'

jobs:
  e2e-full:
    runs-on: [self-hosted, windows, real-gpu]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # test:ci = typecheck ×2 + vitest + playwright --project=edge（全套，含 @slow）
      - run: npm run test:ci
      # always() 而非 failure()：flaky（第一次失敗、重試通過）會讓 job 判定為 success，
      # 但 trace: 'on-first-retry' 正是在那一刻錄到東西。用 failure() 等於在最需要證據的
      # 情況下把它丟掉 —— KI-030 的根因至今未定，就是因為失敗當下的資訊沒被保存。
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-trace-full
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
