[project]
name = "fps-aim-analyst-research"
version = "0.1.0"
description = "Offline research analysis for FPS Aim Analyst exports"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "scipy>=1.14,<2",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["src"]
testpaths = ["src"]

[tool.uv]
package = false
